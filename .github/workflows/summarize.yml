name: Summarize queued videos

# Event-driven drain on a SELF-HOSTED runner (a home PC). GitHub dispatches
# the job when an issue is opened; the runner executes it from your home IP,
# so yt-dlp isn't blocked by YouTube's datacenter-IP bot check (which is why
# the GitHub-hosted runner failed). It reuses the local checkout's venv and
# .env, so no per-run installs and no repo secrets are needed — and it can use
# the local GPU (TRANSCRIBE_BACKEND=local in .env) for caption-less videos.

# INACTIVE by default — the self-contained server (serve.py) is now the queue
# drainer. To switch back to event-driven mode, uncomment the issues/schedule
# triggers below and run a self-hosted runner (see SETUP_SELF_HOSTED.md).
on:
  workflow_dispatch: {}
  # issues:
  #   types: [opened, reopened]
  # schedule:
  #   - cron: "0 7 * * *"

# Never run two drains at once (drain.py processes every open issue).
concurrency:
  group: summarize-queue
  cancel-in-progress: false

jobs:
  summarize:
    # Matches the labels the runner registers with. If you host the runner
    # somewhere other than D:\ContentSummarizer, update working-directory below.
    runs-on: [self-hosted, windows]
    steps:
      - name: Drain the queue
        working-directory: D:\ContentSummarizer
        shell: cmd
        run: .venv\Scripts\python.exe drain.py
