name: Summarize queued videos

# Event-driven cloud drain. When a YouTube link is added to the queue (an
# issue is opened — e.g. by the iOS Shortcut), GitHub runs drain.py on a
# hosted runner: summarize, commit to summaries/, comment, close. No home
# machine required. A once-daily schedule backstops any missed event.

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch: {}       # manual "Run workflow" button
  schedule:
    - cron: "0 7 * * *"       # daily backstop (07:00 UTC) for missed events

# Let the built-in GITHUB_TOKEN list/comment/close issues and commit summaries.
permissions:
  contents: write
  issues: write

# Never run two drains at once — drain.py processes every open issue, so
# overlapping runs could double-process. Queue them instead of cancelling.
concurrency:
  group: summarize-queue
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Drain the queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUMMARY_PROVIDER: openai
          TRANSCRIBE_BACKEND: openai
        run: python drain.py
